# The dev phase grades on this directory's own sealed practice instance (input/, reference/).
#
# Money: the catalogue's twenty-place table, $50 / $35 / $25 / $10 x7 / $7 x10 = $250 (tests/unit/catalogue.test.ts
# TWENTY_PLACE_TABLE; the owner's "$250 total prize, most accurate wins"; the owner answered "Publish: 20 places"),
