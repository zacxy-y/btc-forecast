# GTA VI Twitch CCU forecast 01: forecast, hour by hour, how many people watch Grand Theft Auto VI live on Twitch over
# the 24 UTC hours of its release day, 2026-11-19, from everything recorded up to the end of its first hour, that
# hour's count included, as five quantiles an hour. SEALED (2026-11-17): open and public, its escrow funded at
# open, so once seeded its bytes and its three sealed trees never change again (contest-design.mdc). Copied from competitions/polymarket-nvidia-ceo-forecast-01
# (per-file cases, a pinball loss, a checkpoint race, a house model forecast kind) and refreshed sentence by sentence to
# the root planner's design contract (.tmp/gta6-ccu/DESIGN.md of the launch chat, pinned p1); a change to any shared
# name, schema or figure below goes back to it first.
#
# The owner's ask (2026-11-17), verbatim: "write a program that will predict the 24h CCU graph of GTA 6 after release
# hour by hour after the first hourly CCU print arrives (your program will have access to that print), $250 total prize
# , most accurate wins, runs as a race after it locks over the 24h of GTA 6 release date."
#
# Why Twitch viewers. Grand Theft Auto VI releases on 19 November 2026 on PlayStation 5 and Xbox Series X|S only (no PC
# until 2027) and is single-player: no console maker publishes a player count, so there is no public CCU of the game
# itself. The CCU this contest measures is Twitch's own count of concurrent live viewers in the "Grand Theft Auto VI"
# category, the figure Twitch's directory page shows and the press quotes for a launch (the root's decision, pin p2).
# It is public, read once a minute by anyone, and it moves with the launch the way a player count would. Why a
# forecaster of it beats the public alternatives: there is no public forecast of a launch's hour-by-hour audience
# curve, only after-the-fact charts (TwitchTracker, SullyGnome), and the winner must beat both house entries below
# with a calibrated spread, which a chart read by eye does not give.
#
# The source: POST https://gql.twitch.tv/gql with the header Client-Id kimne78kx3ncx6brgo4mv6wki5h1ko (Twitch's public
# web client id, no secret), query game(id: "1867279146") { id name viewersCount broadcastersCount }. Probed
# 2026-11-17T03:10Z: {"id":"1867279146","name":"Grand Theft Auto VI","viewersCount":1240,"broadcastersCount":181}
# (Grand Theft Auto V, id 32982, read 81,611 viewers and 3,514 channels at the same read).
#
# The recorder (collector/twitch-ccu/ fetch.ts, record.ts, cli.ts; deploy/k8s/components/gta6-twitch-ccu, Deployment
# makefun-twitch-ccu-recorder-gta6): one read a minute, started at second 0 of the minute, up to 3 tries inside the
# minute at a 10 s timeout each, never two lines for one minute, one line per minute in reads.ndjson (schema
# makefun/twitch-ccu-read/v1: minute, at, ok, game {id, name, viewers, channels}, the category's top 20 live streams,
# Twitch's top 20 categories, the raw response's sha256), recording gta6-twitch-ccu under the data root at
# twitch-ccu/gta6-twitch-ccu/record/ (record.json + reads.ndjson), until 2026-11-20T00:10:00Z, resuming and never
# rewriting a line. It runs twice, makefun-prod (primary) and makefun-dev (backup); the freeze takes prod's read for a
# minute and fills a minute prod lacks from dev's. A valid read: ok true, game.id "1867279146", viewers and channels
# non-negative integers.
#
# The clock (collector/twitch-ccu/hours.ts, the one implementation the freeze, the practice cut and the race source
# import). T0 = 2026-11-19T00:00:00Z, the UTC release day (the unlock rolls at local midnight: New Zealand first at
# 2026-11-18T11:00Z, CET 23:00Z, the UK 2026-11-19T00:00Z, US Eastern 05:00Z, US Pacific 08:00Z). Hour h (1..24) is
# [T0 + (h-1) h, T0 + h h). An hour's print is the mean of game.viewers over the valid reads whose minute lies in the
# hour, rounded half up to an integer, with at least 30 valid reads of its 60; an hour with fewer has no print. W0 =
# the deadline = 2026-11-19T01:00:00Z, the end of hour 1: entries lock there, so the final's one case, h00, holds every
# valid read before W0 and hour 1's print (with fewer than 30 reads in hour 1, the mean of whatever valid reads it has,
# at least 1; with none there is no final answer). Scored: hours 2..24, 23 hours, the last ending 2026-11-20T00:00:00Z;
# the final answer needs at least 12 of the 23 printed, or there is no answer, no grade and no prize.
#
# The case (makefun/twitch-ccu-case/v1, <id>.in): schema, id, game {name, twitch_id}, day_start, checkpoint, levels
# [0.05, 0.25, 0.5, 0.75, 0.95], known (hour 1's print: from, until, viewers, channels, reads), forecast (hours 2..24,
# 23 rows), history (every valid point before the checkpoint, oldest first: the recorder's minute reads in the final,
# the historical source's points in the practice, channels possibly null), history_hourly (whole-hour means), streams
# (the top streams at the last valid read before the checkpoint; null in the practice), categories_hourly (null in the
# practice), comparables (past big launches' hourly curves; a practice case's exclude every practice launch, the
# final's include them all) and notes. The forecast (/output/<id>.out, a regular file, never a link):
# {"hours": [{"hour": 2, "q": [q05, q25, q50, q75, q95]}, ...]}, no other key at the top or in a row, exactly 23 rows,
# hours 2..24 each once in any order, each q five finite numbers > 0 and at most 1e9, non-decreasing, at most 65,536
# bytes. The answer (reference/answer.json, makefun/twitch-ccu-answer/v1, min_hours 12, per case its hour-1 print
# print_1, the invalid case's fallback, and its printed hours only) and reference/manifest.json ({"cases": [{"id":
# "h00", "time_cap_ms": 8000}]}, the grader's per-file manifest, as the sibling's).
#
# The score (scorer/score.ts and scorer/forecast.ts, node22 stdlib, per-file cases; the race source imports
# scorer/forecast.ts, so the race and the grade use one loss): each (case, printed hour h, level tau) is one item,
# 2 * max(tau * d, (tau - 1) * d) with d = ln(y) - ln(q_tau), y the hour's print, a print below 1 viewer counted as 1
# (VIEWER_FLOOR). loss is the mean over every item, 6
# decimals, lower better: the rank. The factor 2 makes a forecast whose five quantiles are equal score exactly its mean
# absolute log error, so "most accurate" and an honest spread are one scale. typical_miss_pct = 100 * (exp(mean over
# (case, hour) of |ln y - ln q50|) - 1), 2 decimals, and coverage_90 (the share of (case, hour) with q05 <= y <= q95)
# are information; valid is the gate (1 only when every case's forecast is valid); run_ms (the grader's run.json
# wall_ms, the run time per execution over every case) breaks an exact tie, faster first, then the earlier receipt
# (.cosmos/rules/contest-design.mdc). An invalid case scores as if every quantile equalled its hour-1 print, and makes
# valid 0.
#
# The race (server/race/forecast/spec.ts FORECAST_RACES, source 'twitch-ccu',
# server/race/forecast/sources/twitch-ccu.ts): places 1, cadence 60 minutes, at most 256 racers seated by dev rank
# (stage_by dev_rank), 23 interval reads at
# 2026-11-19T02:00Z .. 2026-11-20T00:00Z (instantsAfter W0, 60, 23), mark pinball, captures every 1,440 minutes prefixed
# h (one capture per racer: case h00 at W0, its input exactly the freeze's h00.in built from the live recording), 8
# captures in flight; the read at T scores hour (T - 60 min, T]. Its marks are provisional; the result is the official
# grade on the frozen recording. The owner's "runs as a race after it locks".
#
# The house entries (prize_requires_beating_baseline: a prize needs a loss strictly below the best of them). The
# persistence baseline (baseline/main.ts, the kit's starter/main.ts byte for byte, starter/main.py the same numbers):
# q50 is the hour-1 print for every hour, q_tau = print_1 * exp(z_tau * 0.15 * sqrt(h - 1)) rounded to 2 decimals
# (print_1 at least 1), z = (-1.645, -0.674, 0, 0.674, 1.645), fixed in advance, entered by the automation from
# house.yaml 4 hours before the deadline. The house
# model one-shot (grader/house-forecast.ts kind twitch-ccu, scripts/competitions/house-forecast.ts --slug
# gta6-twitch-ccu-forecast-01 --phase dev|final --model superbot --reasoning-effort max): superbot at reasoning effort
# max (.cosmos/rules/house-models.mdc, 64,000 output tokens), one recorded call a phase (asked once more, the same
# prompt, only if its first answer is not valid: HOUSE_FORECAST_ATTEMPTS 2), answering per case id 23 median ratios
# r_h (to the case's hour-1 print) and 23 log spreads s_h, replayed per case with no model call: q_tau = print_1 * r_h
# * exp(z_tau * s_h). Dev: one call over the practice cases. Final: one call at 2026-11-18T23:00:00Z (W0 - 2 h) on the
# history to then (no hour-1 print yet: the ratios carry it), replayed on h00. Both are flagged baseline; the rules
# name the model.
#
# The house baseline's practice result: loss 0.387, typical miss 82.8%,
# coverage 0.783 (3 significant figures at most: contest-design.mdc).
#
# The practice (dev phase; collector/twitch-ccu/practice.ts, launches.json): per-file cases p00 to p03, each one
# past big game launch's release day from a public historical source (SullyGnome.com's hourly Twitch category averages), cut by the final's rule:
# day_start 00:00 UTC on the release date (the real unlock in notes), checkpoint an hour later, hours 2..24 its
# answer, its history the source's points before the checkpoint. The launches: Marvel's Wolverine (2026-09-15), Red Dead Redemption 2 (2018-10-26), God of War Ragnarök (2022-11-09) and Marvel's Spider-Man 2 (2023-10-20), all console games that unlocked at midnight local time. No case file holds
# another's answer (each is another launch, and the comparables leave every practice launch out: the preflight's
# practice-lookup); input/NOTICE.txt names each source.
#
# Format: program/v1, cases: per-file beside final_dataset: true (contracts/competition.ts): each case run alone in a
# sandbox of its own, /input holding only <id>.in, its /output/<id>.out kept only when that run ended ok
